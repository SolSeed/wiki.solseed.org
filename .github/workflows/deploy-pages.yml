name: Build search and deploy archive

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble publication directory
        run: cp -a site _site

      - name: Render public archive source
        run: node scripts/build-archive.mjs _source _site

      - name: Generate site version page
        run: node scripts/build-static-version.mjs _site "$GITHUB_SHA"

      - name: Build Pagefind search index
        shell: bash
        run: |
          if find _site -type f -name '*.html' -print -quit | grep -q .; then
            npx --yes pagefind@1.5.2 --site _site
          else
            echo 'No HTML exists yet; skipping the search index.'
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v5
